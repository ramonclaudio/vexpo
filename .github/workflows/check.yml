name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: detect native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              | grep -qE '^(templates/default/|\.github/workflows/check\.yml$)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: packages (typecheck, lint, format, build, test, e2e)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:packages
      - run: npm run coverage
        if: matrix.node-version == '22'
      - run: npm run test:packages:e2e
      - run: node .github/scripts/pack-guard.mjs packages/vexpo
      - run: node .github/scripts/pack-guard.mjs packages/create-vexpo

  template:
    name: template (typecheck, lint, format, test, expo-doctor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/default/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run build -w @ramonclaudio/vexpo
        working-directory: .
      - run: npm pack -w @ramonclaudio/vexpo --pack-destination templates/default
        working-directory: .
      - run: npm ci
      - run: npm install --no-save ramonclaudio-vexpo-*.tgz
      - run: npx vexpo --help
      - run: npx vexpo doctor --json | node -e 'const r=JSON.parse(require("fs").readFileSync(0));process.exit(Array.isArray(r.checks)&&"summary"in r&&"channel"in r?0:1)'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npx expo-doctor

  ios:
    name: ios (release simulator build, smoke flow)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.native == 'true'
    timeout-minutes: 60
    defaults:
      run:
        working-directory: templates/default
    env:
      EXPO_PUBLIC_CONVEX_URL: https://smoke.convex.cloud
      EXPO_PUBLIC_CONVEX_SITE_URL: https://smoke.convex.site
      EXPO_PUBLIC_SITE_URL: https://smoke.convex.site
      EXPO_PUBLIC_APP_BUNDLE_ID: com.vexpo.smoke
      EXPO_PUBLIC_APPLE_TEAM_ID: ABCDE12345
      SMOKE_KEEP_NATIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/default/package-lock.json
      - run: npm ci
      - name: Cache the native project and pods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/Library/Caches/CocoaPods
            templates/default/ios
          key: ios-native-${{ hashFiles('templates/default/package-lock.json', 'templates/default/app.config.ts') }}
      - name: Cache the Xcode build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: templates/default/.smoke-build
          key: ios-derived-${{ hashFiles('templates/default/package-lock.json', 'templates/default/app.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-${{ hashFiles('templates/default/package-lock.json', 'templates/default/app.config.ts') }}-
      - run: curl -fsSL https://get.maestro.mobile.dev | bash
      - run: npm run smoke
      - name: Collect maestro output
        if: failure()
        run: mkdir -p .maestro/debug && cp -R "$HOME/.maestro/tests/." .maestro/debug/ || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: smoke-debug
          path: templates/default/.maestro/

  knip:
    name: knip (unused exports, deps, files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run knip

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
