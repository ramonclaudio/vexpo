name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.2.0). Must already exist on the repo.
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'ramonclaudio/vexpo'
    permissions:
      contents: write
      id-token: write
    env:
      PACKAGES: packages/vexpo packages/create-vexpo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify tag matches package versions
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Tag: $TAG / Version: $VERSION"
          for pkg in $PACKAGES; do
            pkg_version=$(node -p "require('./$pkg/package.json').version")
            if [ "$pkg_version" != "$VERSION" ]; then
              echo "::error::Version mismatch in $pkg: package.json says $pkg_version, tag is $VERSION"
              exit 1
            fi
          done

      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:packages
      - run: npm run test:packages:e2e

      - name: Publish dry-run rehearsal
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in $PACKAGES; do
            node .github/scripts/pack-guard.mjs "$pkg"
            npm publish --dry-run -w "$(node -p "require('./$pkg/package.json').name")"
          done

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in $PACKAGES; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VERSION=$(node -p "require('./$pkg/package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already published, skipping."
            else
              npm publish -w "$NAME"
            fi
          done

      - name: Extract changelog entry
        id: changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry for $VERSION; using fallback." > release-notes.md
          fi
          {
            echo "notes<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
