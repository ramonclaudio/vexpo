version: 2

updates:
  # Root workspace lockfile spans both packages, so one `/` entry covers them.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Scaffolds into thousands of apps. The Expo SDK pins the runtime deps (managed
  # with `expo install`), so Dependabot updates only the tooling and non-Expo deps.
  - package-ecosystem: npm
    directory: /templates/default
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      # `typescript` is in the SDK matrix too, at `~6.0.3`. Dependabot reads the
      # registry, not the matrix, so it offers 7 and `expo-doctor` rejects it.
      # The root entry deliberately has no such rule: the CLI is on 7 already.
      - dependency-name: "typescript"
      # From 1.6.24 the client plugin type stops satisfying
      # `BetterAuthClientPlugin`, so `createAuthClient` infers a client with no
      # plugin actions and the auth screens lose `emailOtp`, `username` and
      # `convex`. Only TypeScript 7 resolves it, which the pin above rules out,
      # so this moves when the SDK moves.
      - dependency-name: "better-auth"
      - dependency-name: "@better-auth/expo"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
