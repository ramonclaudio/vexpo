[extend]
useDefault = true

[[rules]]
id = "asc-identity-in-template-eas-json"
description = "App Store Connect identity in the template eas.json; drop the asc* keys before committing"
regex = '''"asc(AppId|ApiKeyId|ApiKeyIssuerId|ApiKeyPath)"\s*:\s*"[^"]+"'''
path = '''templates/default/eas\.json'''

[[allowlists]]
description = "fake secrets in test fixtures"
paths = [
  '''packages/.*/__tests__/.*''',
  '''.*\.test\.ts''',
]
