name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
      # Generate expo-router typed routes (.expo/types, gitignored) so typecheck
      # catches typedRoutes route-string regressions. Runs without a dev server.
      - run: npx expo customize tsconfig.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    # Placeholders. The smoke flow stops at the sign-in screen, so it never
    # reaches Convex. app.config.ts and src/lib/env.ts both need these set.
    env:
      EXPO_PUBLIC_CONVEX_URL: https://smoke.convex.cloud
      EXPO_PUBLIC_CONVEX_SITE_URL: https://smoke.convex.site
      EXPO_PUBLIC_SITE_URL: https://smoke.convex.site
      EXPO_PUBLIC_APP_BUNDLE_ID: com.example.smoke
      EXPO_PUBLIC_APPLE_TEAM_ID: ABCDE12345
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: curl -fsSL https://get.maestro.mobile.dev | bash
      - run: npm run smoke
      - name: Collect maestro output
        if: failure()
        run: mkdir -p .maestro/debug && cp -R "$HOME/.maestro/tests/." .maestro/debug/ || true
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: smoke-debug
          path: .maestro/
