name: E2E tests

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_ios_simulator:
    name: Build iOS Simulator
    type: build
    params:
      platform: ios
      profile: preview:simulator

  test_creds:
    name: Mint unique test credentials
    outputs:
      email: ${{ steps.creds.outputs.email }}
      password: ${{ steps.creds.outputs.password }}
    steps:
      - id: creds
        run: |
          set-output email "maestro-e2e-$(date +%s)@example.com"
          set-output password "$(openssl rand -hex 16)"

  guard_app_id:
    name: Check MAESTRO_APP_ID is set
    environment: preview
    env:
      MAESTRO_APP_ID: ${{ env.EXPO_PUBLIC_APP_BUNDLE_ID }}
    steps:
      - run: |
          if [ -z "$MAESTRO_APP_ID" ]; then
            echo "MAESTRO_APP_ID is empty. Set EXPO_PUBLIC_APP_BUNDLE_ID in the development EAS environment (eas env:create)."
            exit 1
          fi

  maestro:
    name: Run Maestro flows
    needs: [build_ios_simulator, test_creds, guard_app_id]
    type: maestro
    environment: preview
    env:
      MAESTRO_APP_ID: ${{ env.EXPO_PUBLIC_APP_BUNDLE_ID }}
      MAESTRO_TEST_EMAIL: ${{ needs.test_creds.outputs.email }}
      MAESTRO_TEST_PASSWORD: ${{ needs.test_creds.outputs.password }}
    params:
      build_id: ${{ needs.build_ios_simulator.outputs.build_id }}
      flow_path:
        - .maestro/guest.yaml
        - .maestro/auth.yaml
        - .maestro/launch.yaml
        - .maestro/tour.yaml
        - .maestro/screens.yaml
      retries: 2
