name: E2E tests

# Builds an iOS Simulator binary and runs Maestro flows against it. Mirrors
# the canonical EAS workflow at
# https://docs.expo.dev/eas/workflows/examples/e2e-tests.
#
# Maestro flows live under .maestro/ at the repo root. The build profile
# `development:simulator` already exists in eas.json. it produces a
# .app bundle the Maestro runner can install on an iOS Simulator.
#
# `MAESTRO_APP_ID` resolves to the project's bundle id from the EAS development
# environment (populated by `vexpo full` or `eas env:create`). The flow
# yaml at .maestro/launch.yaml reads it as `appId: ${MAESTRO_APP_ID}`.
#
# The auth flow (.maestro/auth.yaml) signs a fresh account up against the
# dev Convex deployment, so `test_creds` mints a unique email per run.
#
# Builds `preview:simulator`, not `development:simulator`. The development:*
# profiles inherit `developmentClient: true`, so the build comes up on the dev
# client's server picker with no Metro to reach in the cloud, and nothing can
# get past it. preview:simulator embeds the bundle, so the app boots straight
# into itself. It also has no dev menu, so the sheet that scripts/e2e.mjs mutes
# locally never appears here.

# Auto-run on PRs is OFF by default to conserve EAS build credits (each run
# builds an iOS Simulator binary). Trigger manually, or restore the
# `pull_request` trigger below to run it on every PR.
on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_ios_simulator:
    name: Build iOS Simulator
    type: build
    params:
      platform: ios
      profile: preview:simulator

  test_creds:
    name: Mint unique test credentials
    outputs:
      email: ${{ steps.creds.outputs.email }}
      password: ${{ steps.creds.outputs.password }}
    steps:
      - id: creds
        run: |
          set-output email "maestro-e2e-$(date +%s)@example.com"
          set-output password "$(openssl rand -hex 16)"

  guard_app_id:
    name: Check MAESTRO_APP_ID is set
    # The maestro job below reads appId from MAESTRO_APP_ID. If
    # EXPO_PUBLIC_APP_BUNDLE_ID is missing from the development environment it
    # interpolates to empty and Maestro silently can't find the app. Fail here
    # instead so the cause is obvious.
    environment: preview
    env:
      MAESTRO_APP_ID: ${{ env.EXPO_PUBLIC_APP_BUNDLE_ID }}
    steps:
      - run: |
          if [ -z "$MAESTRO_APP_ID" ]; then
            echo "MAESTRO_APP_ID is empty. Set EXPO_PUBLIC_APP_BUNDLE_ID in the development EAS environment (eas env:create)."
            exit 1
          fi

  maestro:
    name: Run Maestro flows
    needs: [build_ios_simulator, test_creds, guard_app_id]
    type: maestro
    environment: preview
    env:
      MAESTRO_APP_ID: ${{ env.EXPO_PUBLIC_APP_BUNDLE_ID }}
      MAESTRO_TEST_EMAIL: ${{ needs.test_creds.outputs.email }}
      MAESTRO_TEST_PASSWORD: ${{ needs.test_creds.outputs.password }}
    params:
      build_id: ${{ needs.build_ios_simulator.outputs.build_id }}
      # Listed one by one, in order. A directory is planned in REVERSE
      # alphabetical order, which runs auth.yaml last, after the three flows
      # that need the session it creates. Same order as ORDERED_FLOWS in
      # scripts/e2e.mjs.
      #
      # zz-delete-restore.yaml is missing on purpose. The delete is gated on
      # LocalAuthentication, and the simulator this job provisions has no
      # enrolled biometric, so the prompt falls back to "Enter iPhone Passcode",
      # which Maestro cannot drive and no passcode satisfies. Confirmed, not
      # assumed: run 01a052b4 failed there with that sheet on screen. Locally
      # scripts/e2e.mjs enrolls a biometric and answers the prompt, but this job
      # runs Maestro directly, so that never executes, and the job type exposes
      # no hook to do it. The gate itself is right (see use-delete-account.ts,
      # Apple 5.1.1(v)) and is not worth weakening for a test, so the
      # delete -> restore journey stays a local check via `npm run e2e`.
      flow_path:
        - .maestro/auth.yaml
        - .maestro/launch.yaml
        - .maestro/tour.yaml
      retries: 2
