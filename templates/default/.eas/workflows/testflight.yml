name: TestFlight

on:
  push:
    branches: ["beta/*"]
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        required: false
        description: 'What to test ("Bug fixes" if omitted)'

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  precheck:
    name: Precheck
    type: custom
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  build_ios:
    name: Build iOS
    needs: [precheck]
    type: build
    params:
      platform: ios
      profile: production

  testflight:
    name: Distribute to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: testflight
      internal_groups: ["Internal"]
      changelog: ${{ inputs.changelog || github.event.head_commit.message || 'Bug fixes' }}
