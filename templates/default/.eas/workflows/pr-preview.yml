name: PR preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        required: false
        description: "PR number to publish a preview for (sets the pr-<n> branch)"

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  precheck:
    name: Precheck
    type: custom
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  fingerprint:
    name: Fingerprint
    needs: [precheck]
    type: fingerprint
    environment: development

  get_existing_build:
    name: Find compatible build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: development:simulator
      wait_for_in_progress: true

  build_ios:
    name: Build iOS Simulator (only if no compatible build exists)
    needs: [get_existing_build]
    if: ${{ !needs.get_existing_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: development:simulator

  publish_update_new:
    name: Publish preview update (new fingerprint path)
    needs: [build_ios]
    if: ${{ github.event.pull_request.number || inputs.pr_number }}
    type: update
    environment: development
    params:
      platform: ios
      branch: pr-${{ github.event.pull_request.number || inputs.pr_number }}

  publish_update_existing:
    name: Publish preview update (existing build path)
    needs: [get_existing_build]
    if: ${{ needs.get_existing_build.outputs.build_id && (github.event.pull_request.number || inputs.pr_number) }}
    type: update
    environment: development
    params:
      platform: ios
      branch: pr-${{ github.event.pull_request.number || inputs.pr_number }}

  comment:
    name: Post results to PR
    after: [build_ios, publish_update_new, publish_update_existing]
    if: ${{ github.event.pull_request.number || inputs.pr_number }}
    type: github-comment
    params:
      message: "🚀 Preview ready. Scan the QR code or open the link to test."
