name: Rotate Apple Sign In JWT

on:
  schedule:
    - cron: "0 12 1 */3 *"
  workflow_dispatch: {}

jobs:
  rotate:
    name: Sign + push fresh client_secret
    type: custom
    runs_on: linux-medium
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Sign + push to Convex
        run: node scripts/rotate-apple-jwt.mjs
