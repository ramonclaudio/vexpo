name: Rollout

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch (production | pr-<n>)
        type: string
        required: true
        default: production
      percentage:
        description: Starting rollout percentage (1-100)
        type: number
        required: true
        default: 25

jobs:
  publish:
    name: Publish to ${{ inputs.percentage }}% on ${{ inputs.branch }}
    type: update
    environment: ${{ inputs.branch == 'production' && 'production' || 'development' }}
    params:
      platform: ios
      branch: ${{ inputs.branch }}
      rollout_percentage: ${{ inputs.percentage }}

  require_approval:
    name: Roll out to everyone?
    type: require-approval
    needs: [publish]

  complete:
    name: Roll out to 100%
    type: update-rollout
    needs: [publish, require_approval]
    params:
      update_group_id: ${{ needs.publish.outputs.first_update_group_id }}
      rollout_percentage: 100
