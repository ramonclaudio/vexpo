name: Deploy to production

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  precheck:
    name: Precheck
    type: custom
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  deploy_convex:
    name: Deploy Convex
    needs: [precheck]
    type: custom
    runs_on: linux-medium
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Deploy Convex backend
        run: npx convex deploy

  fingerprint:
    name: Fingerprint
    needs: [precheck]
    type: fingerprint
    environment: production

  get_ios_build:
    name: Check existing iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build, deploy_convex]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  update_ios:
    name: OTA update
    needs: [get_ios_build, deploy_convex]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      platform: ios
      branch: production
      private_key_path: "$EAS_UPDATE_PRIVATE_KEY"

  print_insights:
    name: Capture update:insights output
    needs: [update_ios]
    if: ${{ needs.update_ios.outputs.first_update_group_id }}
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Print insights JSON
        run: |
          GROUP="${{ needs.update_ios.outputs.first_update_group_id }}"
          echo "Update group: $GROUP"
          npx eas-cli update:insights "$GROUP" --json --non-interactive || true
