appId: ${MAESTRO_APP_ID}
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- assertVisible: "Settings"
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "settings-delete-account"
    direction: DOWN
- tapOn: "Delete account"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: "Delete Account"
- tapOn: "Delete Account"

- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 30000

- runFlow: _sign-in-form.yaml

- extendedWaitUntil:
    visible:
      id: "restore-account-screen"
    timeout: 30000

- assertVisible: ".*permanently deleted on.*"

- tapOn:
    id: "restore-account-restore"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- takeScreenshot: .maestro/screenshots/delete-restore-final
