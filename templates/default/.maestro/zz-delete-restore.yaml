appId: ${MAESTRO_APP_ID}
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- assertVisible: "Settings"
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "settings-delete-account"
    direction: DOWN
- tapOn: "Delete account"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: "Delete Account"
- tapOn: "Delete Account"

- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 30000

- tapOn:
    id: "sign-in-email"
- inputText: ${MAESTRO_TEST_EMAIL}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- tapOn:
    id: "sign-in-email-password-visibility"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "sign-in-email-password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- scrollUntilVisible:
    element:
      id: "sign-in-submit"
    direction: DOWN
- tapOn:
    id: "sign-in-submit"

- extendedWaitUntil:
    visible:
      id: "restore-account-screen"
    timeout: 30000

- assertVisible: ".*permanently deleted on.*"

- tapOn:
    id: "restore-account-restore"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- takeScreenshot: .maestro/screenshots/delete-restore-final
