appId: ${MAESTRO_APP_ID}
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- assertNotVisible:
    id: "sign-in-screen"
- runFlow: _to-settings.yaml

- tapOn: "Help & Feedback"
- extendedWaitUntil:
    visible:
      id: "help-screen"
    timeout: 15000
- assertVisible:
    id: "help-faq-delete-account"
- assertVisible:
    id: "help-faq-notifications"
- assertNotVisible:
    id: "help-link-error"
- assertVisible:
    id: "collapsed"
- tapOn:
    id: "help-faq-delete-account"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "expanded"
- takeScreenshot: .maestro/screenshots/help
- runFlow: _to-settings.yaml

# The Debug row follows the debug preference, which starts at __DEV__, so on a
# release build it is off and the row is not drawn at all. Scroll down to the
# version row it sits under, and turn the preference on when it is not there.
- scrollUntilVisible:
    element:
      id: "settings-copy-version"
    direction: DOWN
- runFlow:
    when:
      notVisible:
        id: "settings-debug"
    commands:
      - tapOn: "Preferences"
      - extendedWaitUntil:
          visible:
            id: "preferences-screen"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "preferences-debug"
          direction: DOWN
      - tapOn:
          id: "preferences-debug"
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow: _to-settings.yaml
      - scrollUntilVisible:
          element:
            id: "settings-debug"
          direction: DOWN
- tapOn:
    id: "settings-debug"
- extendedWaitUntil:
    visible:
      id: "debug-screen"
    timeout: 15000
- takeScreenshot: .maestro/screenshots/debug
- runFlow: _to-settings.yaml

# The linked screen only ever arrives from a deep link, and it is behind the
# signed-in guard, so it belongs here rather than in links.yaml.
- openLink: vexpo:///linked?provider=apple&status=ok
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "linked-screen"
    timeout: 20000
- assertVisible:
    id: "linked-param-provider"
- assertVisible:
    id: "linked-param-status"
- takeScreenshot: .maestro/screenshots/linked
- runFlow: _to-settings.yaml

- tapOn:
    id: "settings-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "profile-change-password"
    direction: DOWN
- tapOn:
    id: "profile-change-password"
- extendedWaitUntil:
    visible:
      id: "change-password-screen"
    timeout: 15000
- assertVisible:
    id: "change-password-current"
- assertVisible:
    id: "change-password-new"
- assertVisible:
    id: "change-password-confirm"
- takeScreenshot: .maestro/screenshots/change-password
- tapOn:
    id: "change-password-cancel"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: _to-settings.yaml
