appId: ${MAESTRO_APP_ID}
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- assertNotVisible:
    id: "sign-in-screen"
- repeat:
    times: 5
    while:
      notVisible:
        id: "settings-screen"
    commands:
      - tapOn: "Settings"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000

- tapOn: "Help & Feedback"
- extendedWaitUntil:
    visible:
      id: "help-screen"
    timeout: 15000
- assertVisible:
    id: "help-faq-delete-account"
- assertVisible:
    id: "help-faq-notifications"
- assertNotVisible:
    id: "help-link-error"
- assertVisible:
    id: "collapsed"
- tapOn:
    id: "help-faq-delete-account"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "expanded"
- takeScreenshot: .maestro/screenshots/help
- repeat:
    times: 5
    while:
      notVisible:
        id: "settings-screen"
    commands:
      - tapOn: "Settings"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000

- tapOn: "Debug"
- extendedWaitUntil:
    visible:
      id: "debug-screen"
    timeout: 15000
- takeScreenshot: .maestro/screenshots/debug
- repeat:
    times: 5
    while:
      notVisible:
        id: "settings-screen"
    commands:
      - tapOn: "Settings"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000

- tapOn:
    id: "settings-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "profile-change-password"
    direction: DOWN
- tapOn:
    id: "profile-change-password"
- extendedWaitUntil:
    visible:
      id: "change-password-screen"
    timeout: 15000
- assertVisible:
    id: "change-password-current"
- assertVisible:
    id: "change-password-new"
- assertVisible:
    id: "change-password-confirm"
- takeScreenshot: .maestro/screenshots/change-password
- tapOn:
    id: "change-password-cancel"
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 5
    while:
      notVisible:
        id: "settings-screen"
    commands:
      - tapOn: "Settings"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000

- repeat:
    times: 5
    while:
      notVisible:
        id: "settings-screen"
    commands:
      - tapOn: "Settings"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000
