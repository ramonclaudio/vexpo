appId: ${MAESTRO_APP_ID}
---
- launchApp
- waitForAnimationToEnd:
    timeout: 15000

- extendedWaitUntil:
    visible: "Home"
    timeout: 30000

- assertNotVisible:
    id: "sign-in-screen"

- tapOn: "Home"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- assertVisible: "Search"
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "search-screen"
    timeout: 15000

- tapOn: "Search screens"
- inputText: "privacy"
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "search-screen"
- assertVisible:
    id: "search-result-privacy"
- tapOn: "Cancel|Close"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: "Settings"
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- assertVisible: "Preferences"
- tapOn: "Preferences"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "preferences-screen"
    timeout: 15000
- assertVisible: "APPEARANCE"

- tapOn: "Dark"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "System"
- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: "HAPTICS"
- tapOn:
    id: "preferences-haptics"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "preferences-haptics"
- waitForAnimationToEnd:
    timeout: 2000

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- assertVisible: "Privacy"
- tapOn: "Privacy"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "privacy-screen"
    timeout: 15000

- assertVisible:
    id: "privacy-camera-photos"
- assertVisible:
    id: "privacy-system-settings"

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- tapOn:
    id: "settings-profile"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 15000

- tapOn:
    id: "profile-bio"
- inputText: " e2e tour"
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- waitForAnimationToEnd:
    timeout: 3000

- scrollUntilVisible:
    element:
      id: "profile-save"
    direction: DOWN
- tapOn:
    id: "profile-save"

- extendedWaitUntil:
    notVisible:
      id: "profile-save"
    timeout: 20000
- assertVisible: ".*e2e tour.*"
- assertVisible: "Saved"

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- assertVisible: "Sessions"
- tapOn: "Sessions"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible:
      id: "sessions-screen"
    timeout: 20000
- extendedWaitUntil:
    visible: "This device"
    timeout: 20000

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- takeScreenshot: .maestro/screenshots/app-tour-final
