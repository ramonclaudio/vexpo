# Subflow, not a flow. Reached with `runFlow: { file: _sign-up-form.yaml, env: { NAME, EMAIL } }`.
#
# Fills the sign-up form and submits it, from the sign-up screen. Each field
# needs a swipe to dismiss the keyboard and a scroll to bring the next one up,
# because the form is taller than the screen once the keyboard is open.
#
# NAME and EMAIL come from the caller and there are no defaults here on purpose.
# A default in this block wins over the `env:` on the runFlow that calls it, so
# guest.yaml signed up with auth.yaml's address and auth.yaml then failed on an
# email that was already taken.
appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: "sign-up-name"
- inputText: ${NAME}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- scrollUntilVisible:
    element:
      id: "sign-up-email"
    direction: DOWN
- tapOn:
    id: "sign-up-email"
- inputText: ${EMAIL}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- scrollUntilVisible:
    element:
      id: "sign-up-password"
    direction: DOWN
- tapOn:
    id: "sign-up-password-visibility"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "sign-up-password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- scrollUntilVisible:
    element:
      id: "sign-up-submit"
    direction: DOWN
- tapOn:
    id: "sign-up-submit"

- assertNotVisible: "Verify your email"
