appId: ${MAESTRO_APP_ID}
---
- runFlow: _cold-start.yaml
- assertVisible: "Enter your credentials.*"

- tapOn: "Sign up"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "sign-up-screen"
    timeout: 15000
- assertVisible: "Create your account"

- runFlow:
    file: _sign-up-form.yaml
    env:
      NAME: "Maestro E2E"
      EMAIL: ${MAESTRO_TEST_EMAIL}

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- assertVisible: "Skip"
- tapOn: "Skip"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000

- assertVisible: "Settings"
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
- tapOn: "Sign out"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Sign Out"
- tapOn: "Sign Out"

- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 20000

- runFlow: _sign-in-form.yaml

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- takeScreenshot: .maestro/screenshots/auth-final

- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
