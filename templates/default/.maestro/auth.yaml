appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- waitForAnimationToEnd:
    timeout: 15000

- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - openLink: ${MAESTRO_DEV_URL}
      - extendedWaitUntil:
          notVisible: "DEVELOPMENT SERVERS"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 15000

- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 20000
- assertVisible: "Enter your credentials.*"

- tapOn: "Sign up"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "sign-up-screen"
    timeout: 15000
- assertVisible: "Create your account"

- tapOn:
    id: "sign-up-name"
- inputText: "Maestro E2E"
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- scrollUntilVisible:
    element:
      id: "sign-up-email"
    direction: DOWN
- tapOn:
    id: "sign-up-email"
- inputText: ${MAESTRO_TEST_EMAIL}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- scrollUntilVisible:
    element:
      id: "sign-up-password"
    direction: DOWN
- tapOn:
    id: "sign-up-password-visibility"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "sign-up-password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- swipe:
    start: 50%, 35%
    end: 50%, 85%

- scrollUntilVisible:
    element:
      id: "sign-up-submit"
    direction: DOWN
- tapOn:
    id: "sign-up-submit"

- assertNotVisible: "Verify your email"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000

- assertVisible: "Skip"
- tapOn: "Skip"
- waitForAnimationToEnd:
    timeout: 5000

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000

- assertVisible: "Settings"
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- tapOn: "Sign out"
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Sign Out"
- tapOn: "Sign Out"

- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 20000

- tapOn:
    id: "sign-in-email"
- inputText: ${MAESTRO_TEST_EMAIL}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- tapOn:
    id: "sign-in-email-password-visibility"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "sign-in-email-password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- scrollUntilVisible:
    element:
      id: "sign-in-submit"
    direction: DOWN
- tapOn:
    id: "sign-in-submit"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- takeScreenshot: .maestro/screenshots/auth-final

- launchApp
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
