appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - openLink: ${MAESTRO_DEV_URL}
      - extendedWaitUntil:
          notVisible: "DEVELOPMENT SERVERS"
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 15000
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 20000

- extendedWaitUntil:
    visible:
      id: "sign-in-submit"
    timeout: 20000
- assertNotVisible:
    id: "sign-in-guest"
- assertNotVisible: "Continue as guest"
- takeScreenshot: .maestro/screenshots/guest-mode-off

- tapOn: "Sign up"
- extendedWaitUntil:
    visible:
      id: "sign-up-screen"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "sign-up-submit"
    timeout: 20000
- assertNotVisible:
    id: "sign-up-guest"
- assertNotVisible: "Continue as guest"
