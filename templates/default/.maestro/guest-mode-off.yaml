appId: ${MAESTRO_APP_ID}
---
- runFlow: _cold-start.yaml

- extendedWaitUntil:
    visible:
      id: "sign-in-submit"
    timeout: 20000
- assertNotVisible:
    id: "sign-in-guest"
- assertNotVisible: "Continue as guest"
- takeScreenshot: .maestro/screenshots/guest-mode-off

- tapOn: "Sign up"
- extendedWaitUntil:
    visible:
      id: "sign-up-screen"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "sign-up-submit"
    timeout: 20000
- assertNotVisible:
    id: "sign-up-guest"
- assertNotVisible: "Continue as guest"
