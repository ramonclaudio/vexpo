appId: ${MAESTRO_APP_ID}
---
- runFlow: _cold-start.yaml

- scrollUntilVisible:
    element:
      id: "sign-in-guest"
    direction: DOWN
- tapOn:
    id: "sign-in-guest"

- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 30000
- assertVisible: "Skip"
- tapOn: "Skip"
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- takeScreenshot: .maestro/screenshots/guest-home

- assertVisible: "Search"
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "search-screen"
    timeout: 20000
- assertVisible:
    id: "search-result-create-an-account"
- assertVisible:
    id: "search-result-profile"
- assertNotVisible:
    id: "search-result-active-sessions"
- takeScreenshot: .maestro/screenshots/guest-search

- assertVisible: "Settings"
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 10000

- extendedWaitUntil:
    visible:
      id: "settings-profile"
    timeout: 20000
- assertVisible:
    id: "settings-create-account"
- assertNotVisible:
    id: "settings-sessions"
- assertNotVisible:
    id: "settings-sign-out"
- takeScreenshot: .maestro/screenshots/guest-settings

- tapOn:
    id: "settings-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 20000
- assertVisible:
    id: "profile-name"
- assertVisible:
    id: "profile-bio"
- assertNotVisible:
    id: "profile-username"
- assertNotVisible:
    id: "profile-email"
- assertNotVisible:
    id: "profile-sign-out"
- assertNotVisible:
    id: "profile-delete-account"
- assertVisible:
    id: "profile-create-account"
- tapOn:
    id: "profile-bio"
- inputText: "written as a guest"
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: "profile-save"
    direction: DOWN
- tapOn:
    id: "profile-save"
- extendedWaitUntil:
    notVisible:
      id: "profile-save"
    timeout: 20000
- takeScreenshot: .maestro/screenshots/guest-profile

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "settings-create-account"
    direction: DOWN
- tapOn: "Create an account"
- extendedWaitUntil:
    visible:
      id: "sign-up-screen"
    timeout: 20000

- scrollUntilVisible:
    element:
      id: "sign-up-dismiss"
    direction: DOWN
- tapOn:
    id: "sign-up-dismiss"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000
- assertVisible:
    id: "settings-create-account"

- tapOn: "Create an account"
- extendedWaitUntil:
    visible:
      id: "sign-up-screen"
    timeout: 20000

- runFlow:
    file: _sign-up-form.yaml
    env:
      NAME: "Guest Upgrade"
      EMAIL: ${MAESTRO_GUEST_EMAIL}

- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "settings-sessions"
    timeout: 20000
- assertNotVisible:
    id: "settings-create-account"
- assertNotVisible:
    id: "settings-discard-guest"
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
- assertVisible:
    id: "settings-sign-out"

- scrollUntilVisible:
    element:
      id: "settings-profile"
    direction: UP
- tapOn:
    id: "settings-profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 20000
- assertVisible:
    id: "profile-username"
- assertVisible:
    id: "profile-email"
- assertVisible: ".*written as a guest.*"
- takeScreenshot: .maestro/screenshots/guest-linked

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
- tapOn:
    id: "settings-sign-out"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 30000
